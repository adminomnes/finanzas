name: Producción - Build & Deploy a VPS

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Prisma Generate
        run: npx prisma generate

      - name: 🔨 Build Validation
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Necesario para que el build funcione si la app llama a Prisma en tiempo de build
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fake_db?schema=public"
          JWT_SECRET: "fake_secret"

      - name: 🚀 Deploy a VPS via SSH
        # Solo ejecuta el deploy si el build fue exitoso
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/omnes-finance
            git pull origin main
            
            # Construir la nueva imagen de Docker sin afectar el contenedor actual
            docker-compose -f docker-compose.prod.yml build
            
            # Reiniciar los contenedores con la nueva imagen (Zero downtime en lo posible)
            docker-compose -f docker-compose.prod.yml up -d
            
            # Limpiar imágenes huérfanas para no llenar el disco del VPS
            docker image prune -f
